<style>
@font-face{font-family:'Berling';src:url('../Berling Bold.otf') format('opentype');font-weight:700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* round nav */

.team .names .nm{font-weight:600;font-size:.9rem}

.score-in{width:62px;height:44px;border:1.5px solid var(--border,rgba(15,23,42,.12));border-radius:10px;text-align:center;font-family:var(--font-display,serif);font-size:1.4rem;font-weight:700;color:var(--text);outline:none;background:var(--bg)}
.score-in:focus{border-color:var(--accent)}
.score-in[readonly]{background:var(--surface-3,#eef0f5);color:var(--muted2,#64748b)}
.vs{text-align:center;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted,#94a3b8);padding:2px 0}

.resting b{color:var(--text);font-weight:600}

/* leaderboard */
.lb-meta{font-size:.72rem;color:var(--muted2,#64748b);margin-bottom:6px}
.lb-lead{background:var(--accent);color:#fff;border-radius:var(--radius,16px);padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 18px var(--accent-glow,rgba(46,78,142,.18))}
.lb-lead .k{font-size:.58rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.lb-lead .nm{font-family:var(--font-display,serif);font-size:1.6rem;font-weight:700;line-height:1.1;margin-top:4px}

.lb-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border,rgba(15,23,42,.06));border-radius:var(--radius-sm,14px);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow,0 1px 3px rgba(0,0,0,.03))}
.lb-rank{font-family:var(--font-display,serif);font-size:1.1rem;font-weight:700;width:22px;text-align:center;color:var(--muted2,#64748b)}
.lb-row.top .lb-rank{color:var(--accent)}

.lb-sub{font-size:.68rem;color:var(--muted2,#64748b);font-weight:400}

.lb-pts small{font-size:.6rem;color:var(--muted2,#64748b);font-weight:500;font-family:var(--font-body,sans-serif)}

/* rename modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.4);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-family:var(--font-display,serif);font-size:1.2rem;margin-bottom:14px}
.sheet input{width:100%;height:48px;border:1.5px solid var(--border,rgba(15,23,42,.12));border-radius:12px;padding:0 14px;font-family:inherit;font-size:1rem;outline:none;background:#fff;margin-bottom:14px}
.sheet input:focus{border-color:var(--accent)}
.hidden{display:none!important}
.footer-actions{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.tap-name{cursor:pointer;border-bottom:1px dashed transparent}
.tap-name:hover{border-bottom-color:var(--muted,#94a3b8)}

<body>
<div class="app">
  <div class="top">
    <a class="backbtn" href="index.html" aria-label="Back to dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="brand"><span class="slash">//</span><h1>Play</h1></div>
  </div>

  <!-- ── SETUP ── -->
  <div id="setup" class="wrap">
    <p class="lead">Run an Americano. Unique partners every round, opponents mixed. Scores and standings live — this is a one-off board, separate from the club leaderboards.</p>

    <div class="field">
      <div class="flabel">Players</div>
      <div class="stepper">
        <button id="pMinus">−</button>
        <div class="val"><span id="pVal">8</span><div class="unit">players</div></div>
        <button id="pPlus">+</button>
      </div>
    </div>

    <div class="field">
      <div class="flabel">Courts</div>
      <div class="stepper">
        <button id="cMinus">−</button>
        <div class="val"><span id="cVal">2</span><div class="unit">courts</div></div>
        <button id="cPlus">+</button>
      </div>
      <div class="hint" id="courtHint"></div>
    </div>

    <div class="field">
      <div class="flabel">Scoring</div>
      <div class="modes">
        <button class="mode sel" id="modeRace" data-mode="race20">
          <div class="mt">Race to 20</div>
          <div class="md">First team to 20 points wins.</div>
        </button>
        <button class="mode" id="modeServe" data-mode="serves24">
          <div class="mt">24 Serves</div>
          <div class="md">24 points total — over 12 wins.</div>
        </button>
      </div>
    </div>

    <button class="cta" id="startBtn">Start Game</button>
  </div>

  <!-- ── GAME ── -->
  <div id="game" class="hidden">
    <div class="tabs">
      <button class="tab on" id="tabRound">This Round</button>
      <button class="tab" id="tabLb">Leaderboard</button>
    </div>
    <div class="wrap">
      <div id="roundView"></div>
      <div id="lbView" class="hidden"></div>
      <div class="footer-actions">
        <button class="cta ghost" id="newGame">New Game</button>
      </div>
    </div>
  </div>
</div>

<!-- rename sheet -->
<div class="modal" id="renameModal">
  <div class="sheet">
    <h3>Rename player</h3>
    <input id="renameInput" type="text" maxlength="24" placeholder="Player name"/>
    <button class="cta" id="renameSave">Save</button>
  </div>
</div>

<script>
const KEY = "dpcAmericanoGame";
const $ = id => document.getElementById(id);
let setup = { players: 8, courts: 2, mode: "race20" };
let game = null;
let view = "round";
let renameIdx = -1;

/* ── SCHEDULER ──────────────────────────────────────────────
   Greedy: each round pick the least-played players to fill the
   courts (rest rotates), pair them minimising repeated partners,
   then match pairs minimising repeated opponents.
   ponytail: greedy heuristic, not provably optimal — good enough
   for club play; swap in an exact solver only if repeats bite. */
function buildSchedule(P, courts) {
  const perRound = Math.min(courts * 4, P - (P % 4)); // active players (multiple of 4)
  // Everyone plays every round → exact 1-factorization: unique partners guaranteed.
  if (perRound === P && P % 4 === 0) return buildFull(P);
  return buildGreedy(P, courts, perRound);
}

// Circle method: P-1 rounds where every pair partners exactly once (0 repeats).
function factorPairs(P) {
  const arr = [...Array(P).keys()], rounds = [];
  for (let r = 0; r < P - 1; r++) {
    const pairs = [];
    for (let i = 0; i < P/2; i++) pairs.push([arr[i], arr[P-1-i]]);
    rounds.push(pairs);
    arr.splice(1, 0, arr.pop()); // rotate all but the first
  }
  return rounds;
}
function buildFull(P) {
  const oppo = Array.from({length:P}, () => new Array(P).fill(0));
  return factorPairs(P).map(pairs => {
    const matches = greedyMatches(pairs, oppo);
    for (const m of matches) for (const a of m.teamA) for (const b of m.teamB) { oppo[a][b]++; oppo[b][a]++; }
    return { matches, resting: [] };
  });
}
// Resting case (fewer courts than players/4): greedy, unique partners best-effort.
function buildGreedy(P, courts, perRound) {
  const partner = Array.from({length:P}, () => new Array(P).fill(0));
  const oppo    = Array.from({length:P}, () => new Array(P).fill(0));
  const played  = new Array(P).fill(0);
  const sched = [];
  for (let r = 0; r < P - 1; r++) {
    const order = [...Array(P).keys()].sort((a,b) => played[a]-played[b] || Math.random()-0.5);
    const active = order.slice(0, perRound), resting = order.slice(perRound);
    active.forEach(p => played[p]++);
    const pairs = greedyPairs(active, partner);
    const matches = greedyMatches(pairs, oppo);
    for (const [x,y] of pairs) { partner[x][y]++; partner[y][x]++; }
    for (const m of matches) for (const a of m.teamA) for (const b of m.teamB) { oppo[a][b]++; oppo[b][a]++; }
    sched.push({ matches, resting });
  }
  return sched;
}
function greedyPairs(players, partner) {
  const pool = [...players].sort(() => Math.random()-0.5);
  const pairs = [];
  while (pool.length) {
    const a = pool.shift();
    let bi = 0, best = Infinity;
    for (let i=0;i<pool.length;i++) if (partner[a][pool[i]] < best) { best = partner[a][pool[i]]; bi = i; }
    pairs.push([a, pool.splice(bi,1)[0]]);
  }
  return pairs;
}
function greedyMatches(pairs, oppo) {
  const pool = [...pairs], matches = [];
  while (pool.length >= 2) {
    const teamA = pool.shift();
    let bi = 0, best = Infinity;
    for (let i=0;i<pool.length;i++) {
      let c = 0;
      for (const a of teamA) for (const b of pool[i]) c += oppo[a][b];
      if (c < best) { best = c; bi = i; }
    }
    matches.push({ teamA, teamB: pool.splice(bi,1)[0] });
  }
  return matches;
}

/* ── STATE ── */
function save() { localStorage.setItem(KEY, JSON.stringify(game)); }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }

function startGame() {
  const P = setup.players, courts = setup.courts;
  const names = Array.from({length:P}, (_,i) => `Player ${i+1}`);
  const schedule = buildSchedule(P, courts);
  const scores = schedule.map(rd => rd.matches.map(() => ({ a: null, b: null })));
  game = {
    names, courts, mode: setup.mode,
    target: setup.mode === "race20" ? 20 : 24,
    schedule, scores, round: 0
  };
  save();
  renderGame();
}

/* ── SCORING / LEADERBOARD ── */
function matchWinner(mode, target, a, b) {
  if (a == null || b == null) return 0;           // unscored
  if (mode === "serves24") return a > 12 ? 1 : b > 12 ? 2 : 0;
  return a >= target && a > b ? 1 : b >= target && b > a ? 2 : (a>b?1:b>a?2:0);
}
function leaderboard() {
  const P = game.names.length;
  const pts = new Array(P).fill(0), wins = new Array(P).fill(0), played = new Array(P).fill(0);
  game.schedule.forEach((rd, ri) => rd.matches.forEach((m, ci) => {
    const s = game.scores[ri][ci];
    const w = matchWinner(game.mode, game.target, s.a, s.b);
    m.teamA.forEach(p => { if (s.a!=null){pts[p]+=s.a; played[p]++; if(w===1)wins[p]++;} });
    m.teamB.forEach(p => { if (s.b!=null){pts[p]+=s.b; played[p]++; if(w===2)wins[p]++;} });
  }));
  return game.names.map((nm,i) => ({ i, nm, pts:pts[i], wins:wins[i], played:played[i] }))
    .sort((a,b) => b.pts-a.pts || b.wins-a.wins || a.nm.localeCompare(b.nm));
}

/* ── RENDER ── */
function renderGame() {
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  view === "round" ? renderRound() : renderLb();
  $("tabRound").classList.toggle("on", view==="round");
  $("tabLb").classList.toggle("on", view==="lb");
  $("roundView").classList.toggle("hidden", view!=="round");
  $("lbView").classList.toggle("hidden", view!=="lb");
}
function nm(i){ return `<span class="tap-name" data-rename="${i}">${game.names[i]}</span>`; }

function renderRound() {
  const R = game.schedule.length, ri = game.round, rd = game.schedule[ri];
  const scored = i => game.scores[i].every(s => s.a!=null && s.b!=null);
  let h = `<div class="rnav">
    <button class="arw" id="rPrev" ${ri===0?"disabled":""}>‹</button>
    <div class="rtitle"><b>Round ${ri+1}</b><span>of ${R}</span></div>
    <button class="arw" id="rNext" ${ri===R-1?"disabled":""}>›</button>
  </div>
  <div class="rpills">${game.schedule.map((_,i)=>`<button class="rpill ${i===ri?"on":scored(i)?"done":""}" data-round="${i}">${i+1}</button>`).join("")}</div>`;

  if (rd.resting.length)
    h += `<div class="resting">Resting this round: <b>${rd.resting.map(p=>game.names[p]).join(", ")}</b></div>`;

  rd.matches.forEach((m, ci) => {
    const s = game.scores[ri][ci];
    const w = matchWinner(game.mode, game.target, s.a, s.b);
    const serve = game.mode === "serves24";
    h += `<div class="court">
      <div class="court-h">Court ${ci+1}</div>
      <div class="team ${w===1?"win":""}">
        <div class="names"><span class="nm">${nm(m.teamA[0])} &amp; ${nm(m.teamA[1])}</span>${w===1?'<span class="wintag">Win</span>':''}</div>
        <input class="score-in" inputmode="numeric" data-s="${ri}-${ci}-a" value="${s.a??""}" placeholder="0">
      </div>
      <div class="vs">vs</div>
      <div class="team ${w===2?"win":""}">
        <div class="names"><span class="nm">${nm(m.teamB[0])} &amp; ${nm(m.teamB[1])}</span>${w===2?'<span class="wintag">Win</span>':''}</div>
        <input class="score-in" inputmode="numeric" data-s="${ri}-${ci}-b" value="${s.b??""}" placeholder="0" ${serve?"readonly":""}>
      </div>
    </div>`;
  });
  $("roundView").innerHTML = h;

  $("rPrev").onclick = () => { game.round--; renderRound(); };
  $("rNext").onclick = () => { game.round++; renderRound(); };
  document.querySelectorAll(".rpill").forEach(b => b.onclick = () => { game.round=+b.dataset.round; renderRound(); });
  document.querySelectorAll(".score-in").forEach(inp => inp.oninput = onScore);
  document.querySelectorAll("[data-rename]").forEach(el => el.onclick = () => openRename(+el.dataset.rename));
}

function onScore(e) {
  const [ri,ci,side] = e.target.dataset.s.split("-");
  let v = e.target.value.replace(/[^\d]/g,"");
  const s = game.scores[+ri][+ci];
  if (game.mode === "serves24") {
    if (v!=="") v = Math.min(24, +v);
    s.a = v==="" ? null : +v;
    s.b = v==="" ? null : 24 - +v;
  } else {
    s[side] = v==="" ? null : +v;
  }
  save();
  renderRound(); // re-render to refresh win tags + serve-partner value
}

function renderLb() {
  const rows = leaderboard();
  const label = game.mode === "serves24" ? "24 Serves · win at 13" : "Race to 20";
  const leader = rows.find(r => r.played > 0) ? rows[0] : null;
  let h = `<div class="lb-meta">${label} · ${game.names.length} players · ${game.courts} courts</div>`;
  if (leader && leader.pts > 0)
    h += `<div class="lb-lead"><div class="k">Leading</div><div class="nm">${leader.nm}</div><div class="pts">${leader.pts} pts · ${leader.wins} wins</div></div>`;
  h += rows.map((r,idx) => `<div class="lb-row ${idx===0&&r.pts>0?"top":""}">
      <div class="lb-rank">${idx+1}</div>
      <div class="lb-nm">${r.nm}<span class="lb-sub"> · ${r.played} played · ${r.wins}W</span></div>
      <div class="lb-pts">${r.pts}<small> pts</small></div>
    </div>`).join("");
  $("lbView").innerHTML = h;
}

/* ── rename ── */
function openRename(i){ renameIdx=i; $("renameInput").value=game.names[i]; $("renameModal").classList.add("open"); $("renameInput").focus(); }
$("renameSave").onclick = () => {
  const v = $("renameInput").value.trim();
  if (v) game.names[renameIdx] = v;
  save(); $("renameModal").classList.remove("open"); renderGame();
};
$("renameModal").onclick = e => { if (e.target.id==="renameModal") $("renameModal").classList.remove("open"); };

/* ── setup controls ── */
function clampCourts(){ const max=Math.max(1,Math.floor(setup.players/4)); if(setup.courts>max)setup.courts=max; if(setup.courts<1)setup.courts=1; }
function renderSetup(){
  clampCourts();
  $("pVal").textContent = setup.players;
  $("cVal").textContent = setup.courts;
  const perRound = Math.min(setup.courts*4, setup.players-(setup.players%4));
  const rest = setup.players - perRound;
  $("courtHint").textContent = `${setup.players-1} rounds · ${perRound} play${rest>0?`, ${rest} rest`:""} each round`;
  $("cMinus").disabled = setup.courts<=1;
  $("cPlus").disabled  = setup.courts>=Math.floor(setup.players/4);
  $("pMinus").disabled = setup.players<=4;
  $("pPlus").disabled  = setup.players>=24;
}
$("pMinus").onclick=()=>{setup.players=Math.max(4,setup.players-1);renderSetup();};
$("pPlus").onclick =()=>{setup.players=Math.min(24,setup.players+1);renderSetup();};
$("cMinus").onclick=()=>{setup.courts=Math.max(1,setup.courts-1);renderSetup();};
$("cPlus").onclick =()=>{setup.courts=Math.min(Math.floor(setup.players/4),setup.courts+1);renderSetup();};
document.querySelectorAll(".mode").forEach(m=>m.onclick=()=>{
  setup.mode=m.dataset.mode;
  document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("sel",x===m));
});
$("startBtn").onclick=startGame;
$("tabRound").onclick=()=>{view="round";renderGame();};
$("tabLb").onclick=()=>{view="lb";renderGame();};
let armNew=false, armTimer;
$("newGame").onclick=()=>{
  const b=$("newGame");
  if(!armNew){ armNew=true; b.textContent="Tap again to reset"; b.style.color="var(--danger,#dc2626)"; b.style.borderColor="var(--danger,#dc2626)";
    clearTimeout(armTimer); armTimer=setTimeout(()=>{armNew=false;b.textContent="New Game";b.style.color="";b.style.borderColor="";},3000); return; }
  clearTimeout(armTimer); armNew=false; b.textContent="New Game"; b.style.color=""; b.style.borderColor="";
  localStorage.removeItem(KEY); game=null; view="round";
  $("game").classList.add("hidden"); $("setup").classList.remove("hidden"); renderSetup();
};

/* ── boot ── */
(function(){
  const saved = load();
  if (saved && saved.schedule) { game = saved; renderGame(); }
  else renderSetup();
})();

/* ── self-test: /americano.html?selftest=1 ── */
if (new URLSearchParams(location.search).get("selftest")==="1") {
  const out=[];
  for (const [P,C] of [[8,2],[12,3],[16,4],[10,2],[6,1]]) {
    const s = buildSchedule(P,C), part={}, games=new Array(P).fill(0);
    let dupPartner=0, maxOppo=0; const opp={};
    s.forEach(rd=>{
      const seen=new Set();
      rd.matches.forEach(m=>{
        [...m.teamA,...m.teamB].forEach(p=>{ if(seen.has(p))out.push(`FAIL ${P}/${C}: player twice in round`); seen.add(p); games[p]++; });
        [m.teamA,m.teamB].forEach(t=>{ const k=t.slice().sort().join("-"); if(part[k])dupPartner++; part[k]=1; });
        for(const a of m.teamA)for(const b of m.teamB){const k=[a,b].sort().join("-");opp[k]=(opp[k]||0)+1;maxOppo=Math.max(maxOppo,opp[k]);}
      });
    });
    console.assert(s.length===P-1, `rounds ${P}`);
    out.push(`${P}p/${C}c: ${s.length} rounds, partner-repeats=${dupPartner}, max opponent-meets=${maxOppo}, games/player=${Math.min(...games)}–${Math.max(...games)}`);
  }
  document.body.innerHTML = "<pre style='padding:20px;font:13px monospace'>"+out.join("\n")+"</pre>";
}
</script>
